<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/pt/" />
    <title>zelph</title>
    <script>
      // Static export has no server left to inspect a request, so the
      // language pick that used to happen in middleware runs here instead:
      // same preference order (remembered cookie, then browser language,
      // then Portuguese), just at the visitor's first paint instead of the
      // edge. The <meta refresh> above is the no-JS fallback.
      (function redirectToLocale() {
        var supported = ['pt', 'en']

        var cookieMatch = document.cookie.match(/(?:^|; )zelph-lang=([^;]+)/)
        var stored = cookieMatch ? cookieMatch[1] : null
        var target = supported.indexOf(stored) !== -1 ? stored : null

        if (!target) {
          var languages = navigator.languages || [navigator.language || '']
          for (var i = 0; i < languages.length; i++) {
            var tag = (languages[i] || '').slice(0, 2).toLowerCase()
            if (supported.indexOf(tag) !== -1) {
              target = tag
              break
            }
          }
        }

        location.replace('/' + (target || 'pt') + '/')
      })()
    </script>
  </head>
  <body></body>
</html>
