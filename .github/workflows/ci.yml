name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      # The static site in `out/` (`output: 'export'`), downloadable from the
      # run page and ready for whichever host the domain ends up pointing at.
      - name: Upload static site
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 14
